# docker compose up -d ; then once: docker compose run --rm models
services:
  ollama:
    image: ollama/ollama:latest
    volumes: [ollama:/root/.ollama]
    restart: unless-stopped
  app:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    env_file: [.env.example]
    environment: {OLLAMA_URL: "http://ollama:11434"}
    volumes: [models:/models, data:/data]
    depends_on: [ollama]
    restart: unless-stopped
  models:  # one-time download job (Whisper + Piper voices + LLM pull through the API)
    build: .
    profiles: [setup]
    environment: {OLLAMA_URL: "http://ollama:11434"}
    volumes: [models:/models]
    depends_on: [ollama]
    command: ["python", "download_models.py"]
volumes: {ollama: {}, models: {}, data: {}}

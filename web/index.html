<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Offline Voice Tutor</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="data:,">
</head>
<body>
<header>
  <h1>Offline Voice Tutor</h1>
  <label>Language <select id="lang"><option value="">Auto-detect</option></select></label>
  <label><input type="checkbox" id="slow"> Slow narration</label>
  <label><input type="checkbox" id="speakText"> Speak text replies</label>
  <label><input type="checkbox" class="phToggle" value="ipa" checked> IPA</label>
  <label><input type="checkbox" class="phToggle" value="readable" checked> Readable</label>
  <label><input type="checkbox" class="phToggle" value="romanized" checked> Romanized</label>
  <button class="sec" id="reset">New chat</button>
</header>
<main>
  <section class="card">
    <div id="log"></div>
    <div class="row">
      <input id="text" placeholder="Type a message (text in → text out)…" autocomplete="off">
      <button id="send">Send</button>
      <button id="mic" title="Tap to talk (auto-stops on silence) or hold to talk. Voice in → voice out.">Talk</button>
    </div>
    <div class="meta" id="status">Loading…</div>
  </section>
  <aside class="card">
    <div class="tabs">
      <button class="on" data-tab="practice">Practice</button>
      <button data-tab="progress">Progress</button>
    </div>
    <div id="tab-practice">
      <textarea id="target" rows="3" style="width:100%" placeholder="Phrase to practise, e.g. Je voudrais un croissant, s'il vous plaît."></textarea>
      <div id="targetPh"></div>
      <div class="row">
        <button class="sec" id="hear">Hear it</button>
        <button class="sec" id="hearSlow">Slow</button>
        <button id="pmic" title="Tap or hold, then repeat the phrase">Record</button>
        <button class="sec hidden" id="playMine">Play mine</button>
      </div>
      <div id="presult"></div>
    </div>
    <div id="tab-progress" class="hidden">
      <div id="progress"></div>
    </div>
  </aside>
</main>
<script src="/static/app.js"></script>
</body>
</html>
